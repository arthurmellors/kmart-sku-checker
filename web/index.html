<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKU Check · AU</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="stylesheet" href="./kosmos-tokens.css?v=plp-gap-2rem" />
    <link rel="stylesheet" href="./styles.css?v=plp-gap-2rem" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <p class="eyebrow">Kosmos · Constructor</p>
        <h1>SKU Check</h1>
        <p class="lede">
          Verify whether specific SKUs are present online in Australia.
        </p>
      </header>

      <section class="control" aria-labelledby="input-label">
        <div class="control-head">
          <label id="input-label" for="sku-input">SKUs</label>
        </div>

        <textarea
          id="sku-input"
          name="skus"
          rows="4"
          spellcheck="false"
          placeholder="One SKU per line&#10;43172382&#10;41026267"
        ></textarea>

        <div class="actions">
          <button type="button" id="check-btn" class="primary">
            <span class="btn-label">Check presence</span>
            <span class="btn-busy" hidden>Checking…</span>
          </button>
          <button type="button" id="export-btn" class="ghost" disabled>Export CSV</button>
          <p id="status-line" class="status-line" aria-live="polite"></p>
        </div>
      </section>

      <section class="summary" id="summary" hidden>
        <div class="summary-item">
          <span class="summary-label">Checked</span>
          <span class="summary-value" id="sum-checked">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Online</span>
          <span class="summary-value" id="sum-au">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Offline</span>
          <span class="summary-value" id="sum-off">0</span>
        </div>
      </section>

      <div id="empty" class="empty">
        <p class="empty-title">No results yet</p>
          <p class="empty-copy">Paste SKUs above and check presence on kmart.com.au.</p>
      </div>

      <div id="loading" class="loading" hidden>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>

      <p id="error-box" class="error-box" hidden></p>

      <div id="result-list" class="grid-3" hidden aria-live="polite"></div>
    </div>

    <script src="./constructor.js?v=plp-gap-2rem"></script>
    <script src="./app.js?v=plp-gap-2rem"></script>
  </body>
</html>
